# Production nginx config for the EC2 server (docker-compose.server.yml).
# Same backend routes as nginx.conf, but the frontend is a static Vite build
# (built by scripts/deploy-aws.sh into /opt/eecstime-site) instead of the Vite
# dev server. Local development keeps using nginx.conf.
server {
    listen       8080;
    server_name  localhost;
    access_log   off;

    # Re-resolve container names (e.g. after a backend container is recreated).
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:5001;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Backend API
    location /api {
        proxy_set_header Host $http_host;
        proxy_pass $backend;
    }

    # Backend redirects (banner clicks, route redirects)
    location /banner/ {
        proxy_set_header Host $http_host;
        proxy_pass $backend;
    }

    location /go/ {
        proxy_set_header Host $http_host;
        proxy_pass $backend;
    }

    location /message/ {
        proxy_set_header Host $http_host;
        proxy_pass $backend;
    }

    # Static frontend. `current` is a symlink to the active release, swapped
    # atomically on deploy.
    root /srv/site/current;

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html, public/ files): revalidate each time, and
    # fall back to index.html for client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
